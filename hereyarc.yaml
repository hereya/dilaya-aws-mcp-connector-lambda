name: dilaya/aws-mcp-connector-lambda
version: 0.1.133
description: "Deploy package for the multi-tenant Dilaya MCP connector: a single Lambda behind API Gateway serving ONE /mcp endpoint for every organization. The authorizer validates the single-URL connect AS token (org_ids set) instead of binding a single org at deploy time. Also serves the static, no-authorizer agent-loop, Telegram, and integration-secret setup routes (/o/{orgId}/{app}/{agent,telegram,secrets}/{proxy+}), plus the outbound MCP-connection surfaces: /mcp-connections/{proxy+} (OAuth consent + fixed DCR callback) and /o/{orgId}/{app}/mcp/{proxy+} (the capability-authenticated gateway app backends call granted external-MCP tools through — connection tokens at /dilaya/*/mcp/*, connector-only, outside the per-app boundary), plus /o/{orgId}/{app}/cron/{proxy+} (capability-authenticated app-cron gateway) and the app-cron EventBridge Scheduler layer: one schedule group ('<stack>-app-crons') + an invoke role (scheduler.amazonaws.com → app Lambdas only) that the connector passes when creating schedules (scheduler CRUD scoped to the group, PassRole pinned to the Scheduler service, per-app boundary untouched); SSM secret access is multi-tenant (/dilaya/*/apps/*), isolation enforced in code. The per-app Lambda permissions boundary additionally allows own-app integration-secret SSM reads (/dilaya/*/apps/*/secrets/*) + KMS-via-SSM decrypt — never /mail/* (app mail goes through the metered gateway). When appContentDomain is set, provisions the app-content-domain edge layer: a CloudFront distribution (*.appContentDomain, wildcard cert + DNS) with a viewer-request Function that host-routes flat vanity hosts <app>--<orgslug>.appContentDomain to the per-app site/auth routes (tagging x-dilaya-app-host), plus auth-lambda vanity-host cookie/redirect awareness — inert without appContentDomain. The auth Lambda also serves a Cognito-native WebAuthn passkey sign-in + registration (auth/passkey/*), on per app when the connector's enable-auth sets passkeys/passkey_rp_id on _auth_config. Forked from hereya/aws-mcp-app-lambda."
visibility: private
iac: cdk
infra: aws
deploy: true
parameters:
  # App-content domain (host-routing, FLAT scheme). All THREE are optional and
  # only meaningful together: set them to serve per-app frontends at the flat
  # vanity host <app>--<orgslug>.<appContentDomain> IN ADDITION to the path URL.
  # Absent → the host-routing feature is fully inert (no CloudFront function /
  # distribution / DNS, no APP_CONTENT_* env, no cloudfront:* IAM).
  appContentDomain:
    description: "App-content domain that fronts per-app frontends at <app>--<orgslug>.<appContentDomain> (e.g. dilaya-apps.eu). Absent → host-routing feature off."
    mandatory: false
  appContentZoneId:
    description: "Route53 hosted-zone id for appContentDomain. Required when appContentDomain is set."
    mandatory: false
  appContentCertArn:
    description: "us-east-1 ACM ARN of the pre-created *.<appContentDomain> wildcard certificate (passed in, NOT created by CDK). Required when appContentDomain is set."
    mandatory: false
  appContentOriginSecret:
    description: "Shared secret for the UN-FORGEABLE origin lock. When set (with appContentDomain), the app-content CloudFront distribution stamps it as x-dilaya-origin-verify on every edge->origin request and the frontend authorizer requires it on site/auth routes — so a direct app.dilaya.eu path hit (which can't reproduce the secret) is denied. Supply from a GitHub Secret, not a Variable. Absent → the authorizer keeps the forgeable marker-presence gate."
    mandatory: false
  appContentRegionOrigins:
    description: "Région CA (t_rca_p1_router step 4): the app-content router serves a host whose KVS value carries g=<region> (an org of another region) from THAT region — dynamic paths to the pod's own API host, /static/* and static sections to that region's static-assets bucket (OAC). Format region:host:bucket-regional-domain, comma-separated, e.g. ca-central-1:app-ca.dilaya.eu:<bucket>.s3.ca-central-1.amazonaws.com. A g with no entry is answered 503 at the edge. Only meaningful with appContentDomain (primary pod). Absent → the router function is byte-identical and ignores g."
    mandatory: false
  domainPurchase:
    description: "Set to \"true\" to enable domain purchase through Dilaya (Route 53 Domains): injects DOMAIN_PURCHASE_ENABLED=true + the route53domains grants (global API, account-broad — hence the explicit opt-in) and the hosted-zone record rights for purchased-domain zones. Requires appContentDomain (the wiring rides the BYOD flow). Absent/other → fully inert."
    mandatory: false
  # Presigned file URLs on a Dilaya host (t_files_own_domain). All THREE
  # together, or none: a pass-through CloudFront distribution (S3 origin, no
  # OAC, all viewer headers except Host, no cache, every method) in front of the
  # hereya/aws-file-storage bucket, A/AAAA records, and FILES_PUBLIC_HOST on the
  # connector — which then swaps only the HOST of each presigned URL. Absent →
  # nothing is created and URLs keep naming *.amazonaws.com.
  filesDomain:
    description: "Host that fronts the file bucket for presigned URLs (e.g. files.dilaya.eu). Absent → feature off."
    mandatory: false
  filesZoneId:
    description: "Route53 hosted-zone id of filesDomain's parent zone. Required when filesDomain is set."
    mandatory: false
  filesCertArn:
    description: "us-east-1 ACM ARN of the pre-validated certificate for filesDomain (passed in, NOT created by CDK). Required when filesDomain is set."
    mandatory: false
  # Alarm → SNS → Telegram relay. Same two names as dilaya/aws-sqlite-data, on
  # purpose: one pair of -p values in the connector's release.yml feeds both
  # packages. ⚠️ A package only receives an input it DECLARES here — an
  # undeclared one is dropped in silence and the deploy still goes green (three
  # wasted releases, 2026-08-07). Do not rename either of these.
  telegramBotTokenParam:
    description: "Nom du paramètre SSM portant le jeton du bot Telegram qui relaie les alarmes du connecteur (refus de jeton de capacité) — jamais le jeton lui-même. Peut pointer sur la fiche de credentials écrite par attach-telegram ({\"bot_token\":…,\"secret_token\":…}) : le relais en extrait bot_token. Vide (défaut) → aucune Lambda de relais, aucun topic, et l'alarme reste sans action comme avant. DOIT être fourni avec telegramChatId."
    mandatory: false
    default: ""
  telegramChatId:
    description: "Chat id Telegram prévenu quand une alarme du connecteur bascule (et quand elle se rétablit). DOIT être fourni avec telegramBotTokenParam — les deux conditionnent la création du relais."
    mandatory: false
    default: ""
  # Réveil de l'agent d'exploitation sur alarme. Telegram prévient Jonatan ; ceci
  # prévient l'AGENT, dont le seul signal de réveil est une notification non lue
  # dans sa boîte. Le 2026-08-24 les deux alarmes plateforme ont basculé 4 fois
  # chacune, le relais a livré ses 16 transitions sans erreur, et rien ne s'est
  # produit pendant 28 h. ⚠️ Les DEUX sont nécessaires — le relais n'obtient le
  # droit d'invoquer le connecteur, et le connecteur ne reçoit sa destination,
  # que si les deux sont non vides. Ce ne sont PAS des littéraux dans la source
  # du connecteur : une seule installation sert tous les locataires, donc y
  # graver notre org serait une verrue permanente.
  alarmInboxOrg:
    description: "Id de l'organisation dont l'agent code reçoit les alarmes de la plateforme. L'enveloppe d'alarme ne porte AUCUN sélecteur de locataire : la destination vient d'ici, jamais de l'appelant. Vide (défaut) → le réveil reste éteint et le connecteur refuse toute enveloppe d'alarme (jamais de repli silencieux). DOIT être fourni avec alarmInboxApp."
    mandatory: false
    default: ""
  alarmInboxApp:
    description: "Nom de l'app dont l'agent code reçoit les alarmes de la plateforme (p. ex. l'app de suivi de développement). DOIT être fourni avec alarmInboxOrg — les deux conditionnent le câblage du réveil."
    mandatory: false
    default: ""
  # Concurrency reservations + the declared account limit (t_reserved_concurrency,
  # t_concurrency_headroom). All optional: absent → the figures in
  # lib/stack/reserved-concurrency.ts (150 / 200 / 50 / 50, account 2 000). Each
  # reservation is also a cap, and the HEADROOM alarm of each function derives
  # its threshold (70 %) from the figure in force — so the scaling ladder is a
  # parameter deploy: raise the figure here, the alarm moves with it. `0` or
  # `none` removes a reservation (and its headroom alarm). A -p only reaches
  # this package if DECLARED here — undeclared, it is dropped in silence.
  reservedConcurrencyHandler:
    description: "Reserved concurrent executions of the connector Lambda (default 150). 0/none removes the reservation."
    mandatory: false
  reservedConcurrencyFrontendAuthorizer:
    description: "Reserved concurrent executions of the frontend authorizer, the front door of every tenant site — it holds a slot while the app answers (default 200). 0/none removes the reservation."
    mandatory: false
  reservedConcurrencyMcpAuthorizer:
    description: "Reserved concurrent executions of the /mcp JWT authorizer (default 50). 0/none removes the reservation."
    mandatory: false
  reservedConcurrencyAuthLambda:
    description: "Reserved concurrent executions of the shared login/OTP Lambda (default 50). 0/none removes the reservation."
    mandatory: false
  lambdaAccountConcurrency:
    description: "The regional Lambda concurrency limit the account was granted (default 2 000, granted 22/09/2026). No API is read at synth: when a support case grants a new tier, it goes here — the account-wide headroom alarm fires at 70 % of it."
    mandatory: false
  # Regional pods (Région Canada, t_rca_p0_infra). Both optional; absent →
  # today's single-pod template, byte for byte (scripts/synth-golden.ts).
  # 2026-10-26 (0.1.121, t_rca_p1_router B2): a secondary pod names its per-app prefix from originDomain —
  # on the shared `app-app-` its deploy-backend would overwrite the EU `app-app-role-shared` policy (IAM is global).
  originDomain:
    description: "Origin host this pod OWNS (API Gateway custom domain + Route 53 record in the customDomain zone), e.g. ca.app.dilaya.eu, while customDomain (and mcp.<zone>) stay the PUBLIC names the pod accepts and advertises (authorizer audience, PRM resource, connector URLs) — those then belong to the front door, so the pod creates neither their domain nor their record. wildcardCertificateArn must then be a cert of the pod's region that covers originDomain. Absent → the pod owns customDomain as today."
    mandatory: false
  # 2026-10-27 (0.1.124, t_rca_p1_router step 5): the PRIMARY pod's origin host next to its public names.
  originAlias:
    description: "An EXTRA origin host the PRIMARY pod owns NEXT TO customDomain and mcp.<zone> (API Gateway custom domain + Route 53 record in the customDomain zone), e.g. app-eu.dilaya.eu — the region router's home origin. Unlike originDomain it removes nothing, so the switch of the public names to the router is a DNS change, reversible. Refused with originDomain. Absent → today's behaviour."
    mandatory: false
  skipGlobalResources:
    description: "\"true\" marks a SECONDARY regional pod: it creates nothing that exists once per account (no legacy *.customDomain frontend distribution with its us-east-1 cert and global CloudFront function name; appContentDomain and filesDomain are refused at synth — appContentDomain is accepted only in consumer mode, with appContentHostKvsArn). Its per-app name prefix (APP_LAMBDA_NAME_PREFIX, which names the connector's account-global runtime IAM roles) comes from originDomain's first label (app-ca.dilaya.eu → app-ca-app-), never the public one. Requires originDomain. Absent/other → today's behaviour."
    mandatory: false
  # 0.1.122 (26/10) — Région CA B1 + G3 (lib/stack/secondary-pod.ts). Inert unless
  # skipGlobalResources=true: primary pods byte-identical (golden a–d + f).
  globalRegistryTableArn:
    description: "SECONDARY pod only (with skipGlobalResources=true): ARN of the PRIMARY (EU) registry DynamoDB table, e.g. arn:aws:dynamodb:eu-west-1:<acct>:table/<name>. Injected as GLOBAL_REGISTRY_TABLE_ARN — the connector reads and writes the registry's GLOBAL partitions (_hosts, _catalog: sole source of truth in the EU) there, cross-region — and granted on that table pinned by dynamodb:LeadingKeys to _hosts/_catalog only. A secondary pod also always gets POD_ROLE=secondary (no edge/domain sweeps) and ssm:GetParameter (+ KMS via SSM) on any project-env value left as an SSM parameter ARN of another region (a static aws: value the executor could not resolve). Ignored on a primary pod. Malformed → refused at synth."
    mandatory: false
  # 0.1.131 (29/10) — Région CA, sites of a secondary pod (t_rca_ca_site_serving,
  # lib/stack/app-content/consumer.ts). Absent → every template unchanged (golden a–g).
  appContentHostKvsArn:
    description: "SECONDARY pod only (with skipGlobalResources=true, appContentDomain and appContentZoneId): ARN of the PRIMARY pod's app-content host-map CloudFront KeyValueStore. Makes this pod a CONSUMER of the primary's edge: it creates no distribution / function / KVS / cert / DNS / BYOD grant, only its own static-assets bucket (output AppContentRegionOrigin = the entry for the primary's appContentRegionOrigins); its connector gets APP_CONTENT_DOMAIN, APP_HOST_KVS_ARN (+ KVS data-plane grant on that ARN), APP_STATIC_BUCKET, APP_CONTENT_ZONE_ID (+ record rights on the zone); its frontend authorizer gets the content domain and, with appContentOriginSecret, the origin lock. Refused on a primary pod, with appContentCertArn / appContentRegionOrigins / domainPurchase, or malformed. Absent → appContentDomain stays refused on a secondary pod."
    mandatory: false
  # 0.1.133 (29/10) — Région CA, custom domains of a consumer pod (t_rca_byod_ca,
  # lib/stack/app-content/byod-edge.ts). Absent → every template unchanged (golden a–h).
  appContentByodEdge:
    description: "CONSUMER pod only (with appContentHostKvsArn and appContentOriginSecret): the PRIMARY's BYOD edge, so this pod runs set/check/remove-custom-domain for its own orgs. Seven ':'-separated fields (hereya cuts a -p at every '='): <routerFunctionName>:<originRequestPolicyId>:<cachePolicyId>:<staticOacId>:<staticBucketRegionalDomain>:<edgeLogBucketRegionalDomain>:<primaryOriginHost> — the values the primary's connector carries (APP_CONTENT_CF_FUNCTION_NAME, APP_CONTENT_ORIGIN_REQUEST_POLICY_ID, APP_CONTENT_CACHE_POLICY_ID, APP_STATIC_OAC_ID, its two buckets' regional domains, POD_ORIGIN_HOST). Its connector gets them under those names (the bucket domains as APP_STATIC_BUCKET_DOMAIN / EDGE_LOG_BUCKET_DOMAIN, the host as POD_ORIGIN_HOST) + APP_CONTENT_ORIGIN_SECRET, so every BYOD distribution it creates is the one the primary would create (the router function picks the region per host); and the primary's BYOD grants (ABAC on dilaya:byod=1: certs in us-east-1, BYOD distributions) + s3:GetBucketAcl on the edge-log bucket. No domain purchase. Refused on a primary pod, without appContentOriginSecret, or malformed. Absent → no BYOD control plane on the consumer pod."
    mandatory: false
  # Région Canada P1 — the REGION ROUTER (t_rca_p1_router, lib/stack/region-router/config.ts).
  # All optional; absent → today's template, byte for byte. ⚠️ hereya cuts a -p at
  # every "=": origins use ":" between region and host, and the secret refuses "=".
  regionRouter:
    description: "\"true\" creates the front door that keeps ONE public URL in front of every regional pod: a CloudFront distribution for customDomain + mcp.<zone>, a viewer-request CloudFront Function (bearer org_ids → org→region KeyValueStore → that region's origin; /o/<orgId>/… paths by the org they name; the token is decoded for ROUTING only, never trusted) and the KVS (starts empty: every org routes home). No DNS record: pointing the public names at it is the cutover, a separate step. Once per account: refused with skipGlobalResources. Requires regionRouterOrigins, regionRouterCertArn, regionRouterOriginSecret."
    mandatory: false
  regionRouterOrigins:
    description: "Comma-separated <region>:<origin host> pairs, e.g. eu-west-1:app-eu.dilaya.eu,ca-central-1:app-ca.dilaya.eu — the FIRST is the home region (unknown org, no bearer, unroutable body). Each host is a pod's own originDomain, never a public name."
    mandatory: false
  regionRouterCertArn:
    description: "us-east-1 ACM ARN of a certificate covering customDomain and mcp.<zone> (e.g. *.dilaya.eu), passed in, not created."
    mandatory: false
  # 2026-10-27 (0.1.126, t_rca_p1_router step 6): THE CUTOVER flag.
  regionRouterPublicDns:
    description: "\"true\" = the cutover: the pod's public records (customDomain, mcp.<zone>) alias the region router's distribution instead of API Gateway, in place (same logical ids, UPSERT both ways; removing the flag is the rollback). The API Gateway custom domains stay. Requires regionRouter=true and a pod that owns the public names (originAlias, never originDomain). Absent → DNS unchanged."
    mandatory: false
  regionRouterEdgeVersionArn:
    description: "Numbered us-east-1 Lambda VERSION ARN of the region router's Lambda@Edge (origin-request, body included): routes a bearer whose orgs sit in different regions by params.arguments.org of the JSON-RPC body (bounded read; fail → home). Built by bin/region-router-edge.ts, outside this stack (Lambda@Edge must live in us-east-1). Absent → no body routing: such requests go home, where the connector relays a call to a foreign org (REGION_ROUTER_ORIGINS, 0.1.125). LEAVE IT ABSENT: the step-5 trial (27/10/2026) measured +64 ms (Ireland) / +210 ms (Montréal) on EVERY request with any origin-request Lambda@Edge."
    mandatory: false
  regionRouterOriginSecret:
    description: "Shared secret the router stamps on every edge→origin request as x-dilaya-region-verify. A pod that has it (the primary AND every secondary pod behind the router) honours x-dilaya-viewer-host — plugin-host detection, PRM resource, 401 resource_metadata — ONLY on requests that carry it; without it the header is ignored. 32–256 printable chars, no '='. Supply from a GitHub Secret. Distinct from appContentOriginSecret on purpose."
    mandatory: false
